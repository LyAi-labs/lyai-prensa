proxy_cache_path /var/cache/nginx/prensa_img keys_zone=img_cache:20m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caché agresivo para proxy de imágenes: 7 días en caché local de Nginx
    location /api/image-proxy {
        proxy_pass http://lyai_prensa_api:8000;
        proxy_cache img_cache;
        proxy_cache_key $arg_url;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Proxy-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_set_header Host $host;
    }

    # Proxy API hacia FastAPI
    location /api/ {
        proxy_pass http://lyai_prensa_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivo del observatorio (public/archivo/index.html): página propia, no la SPA del muro.
    # /archivo, /archivo/contradicciones, /archivo/noticia/<id>… sirven todas el mismo HTML.
    location /archivo {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        try_files /archivo/index.html =404;
    }

    # SPA fallback: cualquier ruta no-fichero cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA Service Worker: nunca cachear para garantizar actualizaciones inmediatas
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # PWA Web App Manifest: siempre fresco
    location ~* (manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types {
            application/manifest+json webmanifest;
            application/json json;
        }
        try_files $uri =404;
    }

    # Cache agresivo para assets con hash de Vite; index.html siempre fresco.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
