server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta no-fichero cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA Service Worker: nunca cachear para garantizar actualizaciones inmediatas
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # PWA Web App Manifest: siempre fresco
    location ~* (manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types {
            application/manifest+json webmanifest;
            application/json json;
        }
        try_files $uri =404;
    }

    # Cache agresivo para assets con hash de Vite; index.html siempre fresco.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
