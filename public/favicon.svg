<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#145ab4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0b0f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28"/>
      <stop offset="100%" stop-color="#0d1119"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="#0a0b0f" stroke="#232834" stroke-width="6"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Back Left Card -->
  <rect x="70" y="90" width="145" height="195" rx="20" fill="#121e30" stroke="#00b4ff" stroke-width="6" opacity="0.75" />

  <!-- Back Right Card (Contradiction warm glow) -->
  <rect x="270" y="70" width="145" height="195" rx="20" fill="#281914" stroke="#ff8c28" stroke-width="6" opacity="0.75" />

  <!-- Front Editorial Card -->
  <rect x="130" y="140" width="235" height="280" rx="26" fill="url(#cardGrad)" stroke="#00e6ff" stroke-width="8"/>

  <!-- Newspaper / P Symbol -->
  <!-- Stem -->
  <rect x="180" y="190" width="22" height="175" rx="10" fill="#ffffff"/>
  <!-- P Loop -->
  <path d="M 180 190 H 260 C 295 190, 295 285, 260 285 H 180" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Contradiction Radar Dot -->
  <circle cx="295" cy="195" r="16" fill="#ff4b4b"/>

  <!-- Editorial data lines -->
  <rect x="180" y="340" width="135" height="8" rx="4" fill="url(#cyanGrad)"/>
  <rect x="180" y="365" width="85" height="8" rx="4" fill="#8c9baf" opacity="0.6"/>
</svg>
